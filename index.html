
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#17131f">
  <meta name="description" content="Soniva Music — temukan musik favoritmu.">

  <title>Soniva Music</title>

  <link rel="manifest" href="./manifest.json">

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/base.css">

  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/navigation.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/search.css">
  <link rel="stylesheet" href="./css/explore.css">
  <link rel="stylesheet" href="./css/album.css">
  <link rel="stylesheet" href="./css/artist.css">
  <link rel="stylesheet" href="./css/library.css">
  <link rel="stylesheet" href="./css/playlist.css">
  <link rel="stylesheet" href="./css/player.css">
  <link rel="stylesheet" href="./css/queue.css">
  <link rel="stylesheet" href="./css/modals.css">
  <link rel="stylesheet" href="./css/settings.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>

<body>
  <div id="app" class="app-shell">

    <!-- Sidebar desktop -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-brand">
        <a href="#home" class="brand-link" aria-label="Soniva Home">
          <span class="brand-icon">♫</span>
          <span class="brand-name">soniva</span>
        </a>
      </div>

      <nav class="sidebar-navigation" aria-label="Navigasi utama">
        <a href="#home" class="nav-link active" data-route="home">
          <span class="nav-icon">⌂</span>
          <span>Home</span>
        </a>

        <a href="#search" class="nav-link" data-route="search">
          <span class="nav-icon">⌕</span>
          <span>Search</span>
        </a>

        <a href="#explore" class="nav-link" data-route="explore">
          <span class="nav-icon">✧</span>
          <span>Explore</span>
        </a>

        <a href="#library" class="nav-link" data-route="library">
          <span class="nav-icon">▤</span>
          <span>Your Library</span>
        </a>
      </nav>

      <div class="sidebar-divider"></div>

      <div class="sidebar-section">
        <h2 class="sidebar-heading">YOUR COLLECTION</h2>

        <a href="#favorites" class="nav-link" data-route="favorites">
          <span class="nav-icon">♥</span>
          <span>Favorite Songs</span>
        </a>

        <a href="#history" class="nav-link" data-route="history">
          <span class="nav-icon">◷</span>
          <span>Listening History</span>
        </a>

        <a href="#playlist" class="nav-link" data-route="playlist">
          <span class="nav-icon">♫</span>
          <span>Playlists</span>
        </a>
      </div>

      <div class="sidebar-bottom">
        <a href="#settings" class="nav-link" data-route="settings">
          <span class="nav-icon">⚙</span>
          <span>Settings</span>
        </a>
      </div>
    </aside>

    <!-- Konten utama -->
    <div class="main-shell">

      <header id="topbar" class="topbar">
        <div class="topbar-navigation">
          <button id="back-button" class="icon-button"
            type="button" aria-label="Kembali">‹</button>

          <button id="forward-button" class="icon-button"
            type="button" aria-label="Maju">›</button>
        </div>

        <div class="topbar-actions">
          <button id="search-shortcut" class="secondary-button"
            type="button">⌕ Cari musik</button>

          <button id="profile-button" class="icon-button"
            type="button" aria-label="Profil pengguna">●</button>
        </div>
      </header>

      <main id="main-content" class="main-content" tabindex="-1">
        <section id="page-container" class="page-container"
          aria-live="polite">
          <div class="page-loading">
            <span class="loading-symbol">♫</span>
            <p>Menyiapkan Soniva...</p>
          </div>
        </section>
      </main>

    </div>

    <!-- Mini player -->
    <section id="mini-player" class="mini-player" hidden
      aria-label="Pemutar musik mini">
      <div class="mini-player-track">
        <img id="mini-player-cover" src="https://ibb.co.com/1tpwjcDG"
          alt="" hidden>

        <div class="mini-player-track-info">
          <span id="mini-player-title">Belum ada lagu</span>
          <span id="mini-player-artist">Pilih musik untuk memulai</span>
        </div>
      </div>

      <div class="mini-player-controls">
        <button id="mini-player-previous" class="icon-button"
          type="button" aria-label="Lagu sebelumnya">◀</button>

        <button id="mini-player-toggle" class="icon-button"
          type="button" aria-label="Putar musik">▶</button>

        <button id="mini-player-next" class="icon-button"
          type="button" aria-label="Lagu berikutnya">▶|</button>
      </div>

      <button id="open-full-player" class="icon-button"
        type="button" aria-label="Buka pemutar musik">⌃</button>
    </section>

    <!-- Navigasi mobile -->
    <nav id="bottom-nav" class="bottom-nav"
      aria-label="Navigasi mobile">
      <a href="#home" class="bottom-nav-link active"
        data-route="home">
        <span>⌂</span>
        <small>Home</small>
      </a>

      <a href="#search" class="bottom-nav-link"
        data-route="search">
        <span>⌕</span>
        <small>Search</small>
      </a>

      <a href="#explore" class="bottom-nav-link"
        data-route="explore">
        <span>✧</span>
        <small>Explore</small>
      </a>

      <a href="#library" class="bottom-nav-link"
        data-route="library">
        <span>▤</span>
        <small>Library</small>
      </a>
    </nav>

    <!-- Root untuk modal -->
    <div id="modal-root"></div>

    <!-- Notifikasi -->
    <div id="toast-root" aria-live="polite"
      aria-atomic="true"></div>

  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
